<div id="app-loading"><img class="logo-img" src="/static/brand/logo-sketch.png" width="250" height="242" alt="" /><h1 class="wordmark"><span class="ui-sr-only">BCL </span><span class="bn-fan">Fantasy</span></h1><div class="spinner" role="presentation"></div><p>Loading your league…</p></div>
<div id="error-banner" role="alert"></div>
<div id="app"></div>
<script src="/static/ui.js?v=paper4"></script>
<script>
"use strict";
var BUDGET_TOTAL=100.0,XI_SIZE=11;

// ─── GLOBAL STATE ─────────────────────────────────────────────────────────────
var _state=null,_leaderboard=null,_players=null,_username=null;
var _isAdmin=false,_mustChange=false;
var _authPending=false;   // true while a saved session is being verified: render() holds back so a returning member never sees the login screen flash by
var _activeTab="match-centre",_currentWeek=1,_historyData=null,_historyViewWk=null;
var _nwDraft={team:[],cap:null,vc:null};
var _pickerSearch="",_pickerRole="All",_pickerTeams=[],_pickerSort="season";   // _pickerTeams: the teams switched on (several at once); empty = every team
var _pickerMaxPrice=null,_pickerFiltersOpen=false,_pickerXiOpen=false;   // null = no price limit; _pickerXiOpen: the "Your XI" strip under the picker header is open
var _nwSaved=null,_nwCarry=false;   // the draft as the server will use it (signature), and whether that is last week's XI carried over
var _nwRestored=false,_lockedWeek=null;   // _nwRestored: the draft on screen came back from this phone; _lockedWeek: the week for which the server refused a save as too late
var _adminMatches=null,_adminFilter="all";
var _adminMembersList=null;
var _switching=false,_switchFailed=false,_swGuard=null,_weekKnown=false,_bootSeq=0;   // competition switch state (see _switchComp); _weekKnown: _currentWeek belongs to the competition on screen; _bootSeq: bumped on every switch so late replies for the old competition are dropped
var members={},matches=[];
var $app=document.getElementById("app"),$loading=document.getElementById("app-loading"),$errorBanner=document.getElementById("error-banner");

function _buildCatalogue(){
  var map={};
  if(_players&&_players.players)_players.players.forEach(function(p){map[p.id]=p;map[p.name.toLowerCase()]=p;});
  return map;
}
function _allPlayers(){
  var seen={},out=[];
  var src=(_players&&_players.players&&_players.players.length>0)?_players.players:[];
  src.forEach(function(p){var k=p.name.toLowerCase();if(!seen[k]){seen[k]=true;out.push(p);}});
  out.sort(function(a,b){return a.name<b.name?-1:1;});
  return out;
}
function resolvePlayer(idOrName){
  if(!idOrName)return{name:"",role:"",team:"",price:0};
  var cat=_buildCatalogue();
  var p=cat[idOrName]||cat[String(idOrName).toLowerCase()];
  if(p)return p;
  var key=String(idOrName).toLowerCase(),all=_allPlayers();
  for(var i=0;i<all.length;i++){if(all[i].name&&all[i].name.toLowerCase().endsWith(key))return all[i];}
  return{name:String(idOrName),role:"",team:"",price:0};
}
function _teamCost(arr){var t=0;arr.forEach(function(id){var p=resolvePlayer(id);t+=(p.price||0);});return Math.round(t*10)/10;}
function _remaining(){return Math.round((BUDGET_TOTAL-_teamCost(_nwDraft.team))*10)/10;}
var LS_KEY="ipl_username";
function getSavedUsername(){try{return localStorage.getItem(LS_KEY)||null;}catch(e){return null;}}
function saveUsername(n){try{localStorage.setItem(LS_KEY,n);}catch(e){}}
function clearUsername(){try{localStorage.removeItem(LS_KEY);}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function hideLoading(){if($loading&&!$loading.classList.contains("hidden")){$loading.classList.add("hidden");setTimeout(function(){if($loading)$loading.remove();},450);}}
function showErrorBanner(msg){Ui.connection.set("reconnecting",msg);}
function hideErrorBanner(){Ui.connection.clear();}
function _avClass(team){
  if(!team)return"";
  switch(team.toLowerCase()){
    case"rcb":return"av-rcb";case"srh":return"av-srh";case"mi":return"av-mi";case"kkr":return"av-kkr";
    case"csk":return"av-csk";case"rr":return"av-rr";case"dc":return"av-dc";case"pbks":return"av-pbks";
    case"lsg":return"av-lsg";case"gt":return"av-gt";
    case"dsg":return"av-dsg";case"jsk":return"av-jsk";case"mict":return"av-mict";case"pr":return"av-pr";case"pc":return"av-pc";case"sec":return"av-sec";default:return"";
  }
}
function _roleBadge(role){
  if(!role)return"";
  var m={WK:"badge-wk",BAT:"badge-bat",AR:"badge-ar",BOWL:"badge-bowl"},cls=m[role]||"";
  return cls?'<span class="badge '+cls+'">'+esc(role)+'</span>':"";
}
function _initials(name){
  if(!name)return"?";
  var parts=name.split(" ");
  if(parts.length===1)return name.substring(0,2).toUpperCase();
  return(parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}

// ─── SESSION ─────────────────────────────────────────────────────────────────
// _establishSession is called after a successful /api/login or /api/register
// (or whoami on bootstrap). It sets globals and triggers initial loads.
function _establishSession(name, isAdmin, mustChange){
  _username=name;_isAdmin=!!isAdmin;_mustChange=!!mustChange;
  _activeTab="match-centre";_historyData=null;_historyViewWk=null;
  _adminMatches=null;_adminMembersList=null;
  window.dispatchEvent(new CustomEvent('ipl:state-updated'));
  saveUsername(name);_loadHistory();
  if(_state)render(_state);
  if(_mustChange) _showResetPasscodeModal(true);
  return true;
}
// attemptLogin(name) is what every member-chip / pill click calls. It opens
// the passcode prompt. Form submits route to IplApi.login → _establishSession.
function attemptLogin(name){
  if(!name)return false;
  _showPasscodePromptModal(name);
  return true;
}
function logout(){
  if(window.IplApi&&IplApi.logoutClearToken)IplApi.logoutClearToken();
  _username=null;_isAdmin=false;_mustChange=false;
  clearUsername();_historyData=null;_historyViewWk=null;
  _nwDraft={team:[],cap:null,vc:null};_nwSaved=null;_nwCarry=false;_nwRestored=false;_lockedWeek=null;_adminMatches=null;_adminMembersList=null;
  if(_state)render(_state);
}
function switchTab(tab){
  if(tab!=="admin")_adminView=null;
  _pickOpen=false;
  _activeTab=tab;
  if(tab==="admin")_loadAdminMatches();
  if(_state)render(_state);
  window.scrollTo(0,0);
  var m=document.getElementById("main");if(m){m.classList.add("enter");m.focus({preventScroll:true});}
}

// ─── HISTORY ────────────────────────────────────────────────────────────────
function _loadHistory(){
  if(!_username||!window.IplApi)return;
  var sq=_bootSeq;   // ignore a reply that arrives after the competition was switched
  window.IplApi.getHistory(_username).then(function(data){
    if(!data||!data.ok||sq!==_bootSeq)return;
    _historyData=data;_currentWeek=data.current_week;_weekKnown=true;
    _nwInit(_getCurrentWeekRow(data));
    if(_state)render(_state);
  }).catch(function(e){console.error("[IPL] history:",e);});
}

// ─── ADMIN MATCHES ────────────────────────────────────────────────────────────
function _loadAdminMatches(){
  var sq=_bootSeq;   // ignore a reply that arrives after the competition was switched
  fetch(_withComp("/api/matches-status"))   // without ?comp= the server answers for the ACTIVE competition (IPL), whatever is selected
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(sq!==_bootSeq)return;
      if(d&&d.ok){_adminMatches=d.matches;}
      if(_state&&_activeTab==="admin")render(_state);
    }).catch(function(){});
}
function _adminSaveUrl(matchId,inputId,statusId){
  var inp=document.getElementById(inputId);
  var statusEl=document.getElementById(statusId);
  var url=inp?inp.value.trim():"";
  if(!url){if(statusEl){statusEl.textContent="Enter a URL first";statusEl.className="admin-save-status err";}return;}
  var btn=document.getElementById("btn-"+matchId);
  if(btn)btn.disabled=true;
  if(statusEl){statusEl.textContent="Saving\u2026";statusEl.className="admin-save-status";}
  fetch(_withComp("/api/update-match-url"),{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("ipl_session_token")||"")},
    body:JSON.stringify({match_id:matchId,url:url})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(btn)btn.disabled=false;
    if(d&&d.ok){
      if(statusEl){statusEl.textContent="\u2705 Saved! Scraping in background\u2026";statusEl.className="admin-save-status ok";}
      _adminMatches=null;
      setTimeout(function(){_loadAdminMatches();if(_state&&_activeTab==="admin")render(_state);},3000);
    } else {
      if(statusEl){statusEl.textContent="\u274c "+(d.error||"Error");statusEl.className="admin-save-status err";}
    }
  }).catch(function(){
    if(btn)btn.disabled=false;
    if(statusEl){statusEl.textContent="\u274c Network error";statusEl.className="admin-save-status err";}
  });
}

// ─── MUTATIONS ────────────────────────────────────────────────────────────────
function _getCurrentWeekRow(hd){
  var d=hd||_historyData;if(!d||!d.weeks)return null;
  for(var i=d.weeks.length-1;i>=0;i--){if(d.weeks[i].is_current)return d.weeks[i];}
  return d.weeks[d.weeks.length-1]||null;
}
function _getThisWeekData(){
  if(_state&&_username&&_state.members&&_state.members[_username]){
    var tw=_state.members[_username].this_week;
    if(tw&&tw.team&&tw.team.length>0)return tw;
  }
  var cur=_getCurrentWeekRow();
  if(cur&&cur.this_week&&cur.this_week.team&&cur.this_week.team.length>0)return cur.this_week;
  return null;
}
function _selectHistoryWeek(wkNo){_historyViewWk=(wkNo===_currentWeek)?null:wkNo;if(_state)render(_state);}
// Every change to the draft goes through _nwChanged: the draft is also kept on this phone (a reload, a closed app or a dropped connection cannot lose it) and the screen redraws.
function _nwChanged(){_nwRestored=false;_draftStore();if(_state)render(_state);}
function _nwSetCap(id){_nwDraft.cap=(_nwDraft.cap===id)?null:id;_nwDraft.vc=(_nwDraft.vc===id)?null:_nwDraft.vc;_nwChanged();}
function _nwSetVc(id){_nwDraft.vc=(_nwDraft.vc===id)?null:id;_nwDraft.cap=(_nwDraft.cap===id)?null:_nwDraft.cap;_nwChanged();}
// One player, one role: regular, captain (x2) or vice-captain (x1.5). Choosing a new captain / vice-captain replaces the old one.
function _nwSetRole(id,role){
  if(role==="cap"){_nwDraft.cap=id;if(_nwDraft.vc===id)_nwDraft.vc=null;}
  else if(role==="vc"){_nwDraft.vc=id;if(_nwDraft.cap===id)_nwDraft.cap=null;}
  else{if(_nwDraft.cap===id)_nwDraft.cap=null;if(_nwDraft.vc===id)_nwDraft.vc=null;}
  _nwChanged();
}
// Tapping a player in the draft opens a radio choice (regular / captain / vice-captain) with room for a thumb, plus Remove.
function _nwOpenPlayer(id){
  if(_deadlineLocked())return;
  var p=resolvePlayer(id),nm=p.name||id,cur=_nwDraft.cap===id?"cap":_nwDraft.vc===id?"vc":"none";
  Ui.sheet({title:nm,subtitle:[p.role,p.team,p.price?p.price.toFixed(1)+" CR":"",p.season_pts!=null?p.season_pts+" pts":""].filter(Boolean).join(" \xb7 "),items:[
    {radio:true,label:"Regular player",desc:"Earns normal points.",checked:cur==="none",onClick:function(){_nwSetRole(id,"none");}},
    {radio:true,label:"Captain",desc:"Earns double points (\xd72).",badge:"C",checked:cur==="cap",onClick:function(){_nwSetRole(id,"cap");}},
    {radio:true,label:"Vice-captain",desc:"Earns \xd71.5 points.",badge:"VC",checked:cur==="vc",onClick:function(){_nwSetRole(id,"vc");}},
    {divider:true},
    {icon:"trash",label:"Remove from XI",danger:true,onClick:function(){_nwRemove(id);}}
  ]});
}
// "Choose your captain / vice-captain": the whole XI in one list, one tap. The hint line offers it while a role is still empty.
function _nwPickRole(which){
  if(_deadlineLocked()||!_nwDraft.team.length)return;
  var cap=which==="cap",cur=cap?_nwDraft.cap:_nwDraft.vc,other=cap?_nwDraft.vc:_nwDraft.cap;
  var ids=_nwDraft.team.slice().sort(function(a,b){return(resolvePlayer(b).season_pts||0)-(resolvePlayer(a).season_pts||0);});   // best scorers first
  Ui.sheet({title:cap?"Choose your captain":"Choose your vice-captain",subtitle:cap?"Earns double points (\xd72).":"Earns \xd71.5 points.",items:ids.map(function(id){
    var p=resolvePlayer(id);
    return {radio:true,label:p.name||id,desc:[p.role,p.team,p.season_pts!=null?p.season_pts+" pts":"",id===other?(cap?"now vice-captain":"now captain"):""].filter(Boolean).join(" \xb7 "),checked:id===cur,onClick:function(){
      _nwSetRole(id,which);
      if(cap&&!_nwDraft.vc)setTimeout(function(){_nwPickRole("vc");},60);   // captain done: offer the vice-captain straight away (Escape skips it)
    }};
  })});
}
// Removing a player is easy to do by accident, so it can always be undone (for a few seconds) from the toast.
function _nwRemove(id,quiet){
  var at=_nwDraft.team.indexOf(id);if(at<0)return;
  var wasCap=_nwDraft.cap===id,wasVc=_nwDraft.vc===id;
  _nwDraft.team=_nwDraft.team.filter(function(x){return x!==id;});
  if(wasCap)_nwDraft.cap=null;
  if(wasVc)_nwDraft.vc=null;
  _nwChanged();
  if(quiet)return;
  Ui.toast((resolvePlayer(id).name||id)+" removed",{type:"info",duration:6000,action:{label:"Undo",onClick:function(){
    if(_nwDraft.team.indexOf(id)>=0||_nwDraft.team.length>=XI_SIZE)return;
    if(_teamCost(_nwDraft.team)+(resolvePlayer(id).price||0)>BUDGET_TOTAL+0.001){Ui.warn("Not enough budget left to bring them back.");return;}
    _nwDraft.team.splice(Math.min(at,_nwDraft.team.length),0,id);
    if(wasCap)_nwDraft.cap=id;
    if(wasVc)_nwDraft.vc=id;
    _nwChanged();
  }}});
}
function _nwToggle(id){
  var idx=_nwDraft.team.indexOf(id);
  if(idx!==-1){_nwRemove(id);return;}
  if(_nwDraft.team.length>=XI_SIZE)return;
  var p=resolvePlayer(id),cost=_teamCost(_nwDraft.team)+(p.price||0);
  if(cost>BUDGET_TOTAL)return;
  _nwDraft.team.push(id);
  _nwChanged();
}
// Back to what is saved (the saved draft, or last week's XI): for when a draft has gone the wrong way. Undo brings the edits back.
function _nwDiscard(){
  var before={team:_nwDraft.team.slice(),cap:_nwDraft.cap,vc:_nwDraft.vc};
  if(!_nwLoadSaved(_getCurrentWeekRow()))_nwDraft={team:[],cap:null,vc:null};
  _nwChanged();
  Ui.toast("Changes discarded",{type:"info",duration:6000,action:{label:"Undo",onClick:function(){_nwDraft=before;_nwChanged();}}});
}
var _nwSaving=false,_nwSlow=false,_nwSlowT=null;
function _nwSave(){
  if(!_username||_nwSaving)return;
  if(_deadlineLocked()){Ui.warn("Picks are locked. Your last saved XI is the one that counts.");return;}
  if(_nwDraft.team.length!==XI_SIZE){Ui.warn("Select exactly "+XI_SIZE+" players first.");return;}
  // Captain AND vice-captain are required: the captain scores double, so an XI without one is never saved. The Save button is off until both are chosen; this is the safety net.
  if(!_nwDraft.cap||!_nwDraft.vc){var which=!_nwDraft.cap?"cap":"vc";Ui.warn("Choose your "+(which==="cap"?"captain":"vice-captain")+" first.");_nwPickRole(which);return;}
  var sent=_nwSig(_nwDraft);
  _nwSaving=true;_nwSlow=false;if(_state)render(_state);
  clearTimeout(_nwSlowT);_nwSlowT=setTimeout(function(){if(_nwSaving){_nwSlow=true;if(_state)render(_state);}},4000);
  window.IplApi.saveNextWeek(_username,_nwDraft)
    .then(function(){
      _nwSaving=false;_nwSlow=false;clearTimeout(_nwSlowT);
      _nwSaved=sent;_nwCarry=false;_nwRestored=false;        // what we sent is now what the server holds
      _draftStore();                                          // ...so the copy kept on this phone is no longer needed (unless it was edited again meanwhile)
      Ui.success("Team saved");
      window.dispatchEvent(new CustomEvent("ipl:saved"));
      if(_state)render(_state);
    }).catch(function(e){
      _nwSaving=false;_nwSlow=false;clearTimeout(_nwSlowT);
      if(e&&e.status===423){_nwTooLate();return;}
      var offline=!(e&&e.status);   // no HTTP status = the request never got an answer
      if(offline)Ui.toast("Could not save your team: "+Ui.errorMessage(e)+" Your picks are kept on this phone.",{type:"error",duration:7000});
      else Ui.fail(e,"Could not save your team");
      if(_state)render(_state);
    });
}
// The deadline has passed (the server says so, or the countdown ran out): the screen becomes read-only and says what counts.
function _nwTooLate(){
  _lockedWeek=_currentWeek;
  _nwCloseLayer();
  if(_state)render(_state);
  Ui.warn("Picks have just locked, so that could not be saved. Your last saved XI is the one that counts.",{duration:7000});
}
function _nwCloseLayer(){if(!_pickOpen)return;_pickOpen=false;try{if(history.state&&history.state.ui==="pick")history.back();}catch(e){}}

// ─── PICKER: filters update the list in place (no page rebuild), so typing, dragging the slider and keyboard focus are never interrupted ───
var _psTimer=null;
function _pickerUpdate(){
  var V=_pickerView(),el;
  el=document.getElementById("pr-seg");
  if(el){Ui.segSet(el,_pickerRole);[].forEach.call(el.querySelectorAll(".seg-opt"),function(b){var c=b.querySelector(".seg-n");if(c)c.textContent=V.counts[b.getAttribute("data-v")];});}
  el=document.getElementById("pf-sort");if(el)Ui.segSet(el,V.sv);
  Ui.chipsSet(document.getElementById("pf-team"),_pickerTeams);
  var cur=V.maxP!==null?V.maxP:V.pb.max,txt=V.maxP!==null?"Up to "+cur.toFixed(1)+" CR":"Any price";
  el=document.getElementById("pf-price");
  if(el){if(parseFloat(el.value)!==cur)el.value=cur;Ui.rangeFill(el);el.setAttribute("aria-valuetext",txt);}
  el=document.getElementById("pf-price-out");if(el)el.textContent=txt;
  el=document.getElementById("pf-badge");if(el){var a=_pickerActive(V);el.textContent=a;el.hidden=!a;}
  el=document.getElementById("ps-clear");if(el)el.hidden=!_pickerSearch;
  el=document.getElementById("pf-fit");if(el)el.hidden=!(_nwDraft.team.length<XI_SIZE&&_remaining()>=V.pb.min);
  el=document.getElementById("picker-results");if(el)el.innerHTML=_pickerResultsHtml(V);
  el=document.getElementById("plist");if(el)el.innerHTML=_pickerRowsHtml(V);
}
function _pickerSetRole(r){_pickerRole=r;_pickerUpdate();}
// A team chip switches that team on or off; several can be on together. "" (the "All" chip) switches them all off = every team.
function _pickerToggleTeam(t){
  if(!t)_pickerTeams=[];
  else if(_pickerTeams.indexOf(t)<0)_pickerTeams=_pickerTeams.concat([t]);
  else _pickerTeams=_pickerTeams.filter(function(x){return x!==t;});
  _pickerUpdate();
}
function _pickerSetSort(s){_pickerSort=s;_pickerUpdate();}
function _pickerSetPrice(v){v=parseFloat(v);if(isNaN(v))return;_pickerMaxPrice=(v>=_priceBounds().max-0.001)?null:v;_pickerUpdate();}
function _pickerFitBudget(){_pickerSetPrice(Math.max(_priceBounds().min,Math.floor(_remaining()*2)/2));}
function _pickerSetSearch(v){_pickerSearch=v;_pickerUpdate();}
function _pickerSearchInput(v){_pickerSearch=v;var c=document.getElementById("ps-clear");if(c)c.hidden=!v;clearTimeout(_psTimer);_psTimer=setTimeout(_pickerUpdate,90);}
function _pickerClear(){_pickerRole="All";_pickerTeams=[];_pickerSearch="";_pickerMaxPrice=null;var i=document.getElementById("picker-search-input");if(i)i.value="";_pickerUpdate();}
var _lastTap={id:"",t:0};
function _pickerRowClick(id){
  if(!id)return;
  // On a slow phone a member taps again because nothing seems to have happened: that second tap must not undo the first (add, then straight out again).
  var now=Date.now();
  if(_lastTap.id===id&&now-_lastTap.t<400)return;
  _lastTap={id:id,t:now};
  var p=resolvePlayer(id);
  // A player who is already in the XI is taken OUT by tapping again (the Undo toast covers a slip): no trip back to the squad screen.
  var inXi=_nwDraft.team.indexOf(id)!==-1?id:(p.name&&_nwDraft.team.indexOf(p.name)!==-1?p.name:null);
  if(inXi!==null){_nwRemove(inXi);return;}
  if(_nwDraft.team.length>=XI_SIZE){
    _showSwapModal(id);
    return;
  }
  var cost=_teamCost(_nwDraft.team)+(p.price||0);
  if(cost>BUDGET_TOTAL+0.001){
    Ui.warn("Over budget by "+((cost-BUDGET_TOTAL).toFixed(1))+" CR. Take someone out first, or pick a cheaper player.");
    return;
  }
  _nwToggle(id);
}

function _doStateRefresh(onDone){
  var stP=fetch(_withComp("/api/state"),{headers:{"Accept":"application/json","Cache-Control":"no-cache"}}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  var lbP=fetch(_withComp("/api/leaderboard"),{headers:{"Accept":"application/json"}}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  var hP=(_username&&window.IplApi)?window.IplApi.getHistory(_username).catch(function(){return null;}):Promise.resolve(null);
  // Also refresh /api/players — without this, ext_* players added by the
  // scraper since page-load show up in selections as raw IDs (e.g.
  // "ext_10945" with no name/team/role) because the catalogue is stuck
  // on the bootstrap snapshot. See ipl_glue.js _pollCycle for the same
  // fix on the ETag-driven polling path.
  var plP=window.IplApi?window.IplApi.getPlayers().catch(function(){return null;}):Promise.resolve(null);
  Promise.all([stP,lbP,hP,plP]).then(function(results){
    var state=results[0],lb=results[1],history=results[2],players=results[3];
    if(state&&!_staleState(state)){
      if(history&&history.ok){
        var _wasWk=_currentWeek,_hadWk=_weekKnown;
        _historyData=history;_currentWeek=history.current_week;_weekKnown=true;
        if(_hadWk&&_currentWeek!==_wasWk)_nwNewWeek(_getCurrentWeekRow(history));
      }
      if(lb){_leaderboard=window.normaliseLeaderboard?window.normaliseLeaderboard(lb):lb;}
      if(players&&players.ok!==false){_players=players;}
      window.dispatchEvent(new CustomEvent('ipl:state-updated'));
      render(state);
    }
    if(onDone)onDone(!!state);
  });
}

// ─── DRAFT STATE: "saved" means what the server will use at the rollover (the saved draft, or last week's XI when nothing was saved) ───
function _nwSig(d){return JSON.stringify({t:((d&&d.team)||[]).slice().sort(),c:(d&&d.cap)||null,v:(d&&d.vc)||null});}
function _nwDirty(){return _nwSig(_nwDraft)!==_nwSaved;}
function _nwHasUnsaved(){return _nwDraft.team.length>0&&_nwDirty();}   // picks that would be lost: an empty draft has nothing to lose
// The draft = what the server holds (the saved draft, or last week's XI when nothing was saved). False when the member has neither yet.
function _nwLoadSaved(row){
  var nw=row&&row.next_week,tw=row&&row.this_week;
  if(nw&&nw.team&&nw.team.length>0){_nwDraft={team:nw.team.slice(),cap:nw.cap,vc:nw.vc};_nwSaved=_nwSig(_nwDraft);_nwCarry=false;return true;}
  if(tw&&tw.team&&tw.team.length>0){_nwDraft={team:tw.team.slice(),cap:tw.cap,vc:tw.vc};_nwSaved=_nwSig(_nwDraft);_nwCarry=true;return true;}
  return false;
}
// The rollover ran while the app was open: the old week's draft is history, the new one starts from what the server holds for it.
function _nwNewWeek(row){
  _nwRestored=false;
  if(!_nwLoadSaved(row)){_nwDraft={team:[],cap:null,vc:null};_nwSaved=null;_nwCarry=false;}
  _draftStore();
}
function _nwInit(row){
  _nwLoadSaved(row);   // row is null for a member with no history yet (a new member, or before the first week): nothing saved, but picks may still be waiting on this phone
  if(!_nwHasUnsaved())_draftRestore();   // picks that were never saved come back after a reload, a closed app or a dropped connection
}
// ─── THE UNSAVED DRAFT IS ALSO KEPT ON THIS PHONE (per member, competition and week; thrown away once saved, or once the server's copy has moved on) ───
// The competition is read the way the API calls read it (the stored selection is there from the first instant; _activeComp is only set once the competition list has arrived).
function _draftKey(){return "ipl_draft:"+((window.IplComp&&IplComp.get&&IplComp.get())||_activeComp||"")+":"+(_username||"");}
function _draftStore(){
  try{
    if(!_username)return;
    if(!_nwHasUnsaved()){localStorage.removeItem(_draftKey());return;}
    localStorage.setItem(_draftKey(),JSON.stringify({wk:_currentWeek,base:_nwSaved,team:_nwDraft.team,cap:_nwDraft.cap,vc:_nwDraft.vc}));
  }catch(e){}   // private mode / storage full: the draft simply stays in memory, as before
}
function _draftRestore(){
  try{
    if(!_username)return false;
    var k=_draftKey(),raw=localStorage.getItem(k);if(!raw)return false;
    var d=JSON.parse(raw);
    var team=(d&&Array.isArray(d.team))?d.team.filter(function(x){return typeof x==="string"&&x;}):[];
    // only a draft made against what the server holds NOW, in this same week, is worth bringing back
    if(!d||d.wk!==_currentWeek||d.base!==_nwSaved||!team.length||team.length>XI_SIZE||new Set(team).size!==team.length){localStorage.removeItem(k);return false;}
    var cap=team.indexOf(d.cap)>=0?d.cap:null,vc=(team.indexOf(d.vc)>=0&&d.vc!==cap)?d.vc:null;
    var keep=_nwDraft;_nwDraft={team:team,cap:cap,vc:vc};
    if(!_nwDirty()){_nwDraft=keep;localStorage.removeItem(k);return false;}   // the same as what is saved: nothing to bring back
    _nwRestored=true;return true;
  }catch(e){return false;}
}

function _priceBounds(){
  var mn=Infinity,mx=0;
  _allPlayers().forEach(function(p){var v=p.price||0;if(v>0){if(v<mn)mn=v;if(v>mx)mx=v;}});
  if(!isFinite(mn))return{min:0,max:20};
  return{min:Math.floor(mn*2)/2,max:Math.ceil(mx*2)/2};
}
function _pickerView(){
  var allP=_allPlayers(),teams=[],ts={},pb=_priceBounds();
  allP.forEach(function(p){if(p.team&&!ts[p.team]){ts[p.team]=true;teams.push(p.team);}});
  teams.sort();
  var q=_pickerSearch.toLowerCase().trim();
  var maxP=(_pickerMaxPrice!==null&&_pickerMaxPrice<pb.max-0.001)?_pickerMaxPrice:null;
  function pass(p,withRole){
    if(withRole&&_pickerRole!=="All"&&p.role!==_pickerRole)return false;
    if(_pickerTeams.length&&_pickerTeams.indexOf(p.team)===-1)return false;
    if(q&&(p.name+" "+(p.team||"")).toLowerCase().indexOf(q)===-1)return false;
    if(maxP!==null&&(p.price||0)>maxP+0.001)return false;
    return true;
  }
  var filtered=allP.filter(function(p){return pass(p,true);});
  var counts={All:0,WK:0,BAT:0,AR:0,BOWL:0};   // how many players each role has under the OTHER filters
  allP.forEach(function(p){if(pass(p,false)){counts.All++;if(counts[p.role]!==undefined)counts[p.role]++;}});
  var sv=_pickerSort||"season";
  filtered.sort(function(a,b){
    if(sv==="price")return(b.price||0)-(a.price||0);
    if(sv==="name")return a.name<b.name?-1:1;
    return(b.season_pts||0)-(a.season_pts||0);
  });
  return{teams:teams,filtered:filtered,counts:counts,pb:pb,maxP:maxP,q:q,sv:sv};
}

function _doRegister(){
  var inp=document.getElementById('register-input');
  var pin=document.getElementById('register-passcode');
  var errEl=document.getElementById('register-error');
  var name=inp?inp.value.trim():'';
  var pc=pin?pin.value.trim():'';
  if(!name||name.length>30){if(errEl)errEl.textContent='Name must be 1\u201330 characters.';return;}
  if(!/^\d{4}$/.test(pc)){if(errEl)errEl.textContent='Passcode must be exactly 4 digits.';return;}
  if(errEl)errEl.textContent='';
  window.IplApi.register(name,pc).then(function(d){
    if(!d||!d.ok)throw new Error('register failed');
    window.dispatchEvent(new CustomEvent('ipl:saved'));
    _establishSession(d.name,d.is_admin,d.must_change);
  }).catch(function(e){
    var msg=(e&&e.serverMessage)?e.serverMessage:'Could not register';
    if(errEl)errEl.textContent='\u26a0 '+msg;
  });
}

var _newCompOpen=false,_ncSlugTouched=false;

function _ncDate(){
  var v=(document.getElementById("newcomp-anchor")||{}).value,h=document.getElementById("nc-date-h");if(!h)return;
  if(!v){h.className="hint";h.textContent="The first Monday after the opening match. It sets every week's Monday lock and cannot be changed later.";return;}
  var d=new Date(v+"T00:00:00Z"),days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var label=days[d.getUTCDay()]+" "+d.getUTCDate()+" "+mon[d.getUTCMonth()]+" "+d.getUTCFullYear();
  if(d.getUTCDay()!==1){h.className="hint err";h.textContent=label+" is not a Monday. Pick the Monday after the opening match.";}

    validate:function(v){return tied.indexOf(v)<0?"Must be exactly one of: "+tied.join(", "):"";}}).then(function(who){

function _adminCreateComp(){

    window.IplApi.adminCompetition(body).then(function(d){
      if(d&&d.ok){Ui.success("Created "+slug+". Next: click Import data on it to load its players and schedule.",{duration:9000});_bootstrap();}

    }).catch(function(e){Ui.fail(e);});

// ─── ADMIN: IMPORT COMPETITION DATA ──────────────────────────────────────────
// Upload a players.json and/or schedule.json for a competition. Every upload is
// checked first (dry run: the server reports exactly what would change and writes
// nothing); "Import now" repeats it with dry_run:false. State lives in _imp, not in the
// DOM, because render() rebuilds the whole page (a background refresh must not lose it).
var _imp={slug:null,players:null,playersName:"",schedule:null,scheduleName:"",report:null,busy:false,msg:"",done:false,anchor:"",needsAnchor:false};
function _impReset(slug){_imp={slug:slug,players:null,playersName:"",schedule:null,scheduleName:"",report:null,busy:false,msg:"",done:false,anchor:"",needsAnchor:false};}
function _impRedraw(){if(_state)render(_state);}
function _impOpen(slug){_impReset(_imp.slug===slug?null:slug);_impRedraw();}
function _impPick(kind,input){
  var f=input&&input.files&&input.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var obj;
    try{obj=JSON.parse(rd.result);}
    catch(e){_imp[kind]=null;_imp[kind+"Name"]="";_imp.report=null;_imp.msg=f.name+" is not valid JSON ("+e.message+")";_impRedraw();return;}
    _imp[kind]=obj;_imp[kind+"Name"]=f.name;_imp.msg="";_imp.report=null;_imp.done=false;
    _impCall(true);
  };
  rd.onerror=function(){_imp.msg="Could not read "+f.name;_impRedraw();};
  rd.readAsText(f);
}
function _impCall(dry){
  if(_imp.players===null&&_imp.schedule===null){_imp.msg="Choose a players.json and/or schedule.json file first.";_impRedraw();return Promise.resolve();}
  var body={action:"import",slug:_imp.slug,dry_run:dry};
  if(_imp.players!==null)body.players=_imp.players;
  if(_imp.schedule!==null)body.schedule=_imp.schedule;
  if(_imp.anchor)body.week1_anchor_utc=_imp.anchor+"T14:00:00+00:00";   // only accepted while the competition has no week-1 date
  _imp.busy=true;_imp.msg="";_impRedraw();
  return window.IplApi.adminCompetition(body).then(function(d){
    _imp.busy=false;_imp.report=d;_imp.done=!dry&&!!(d&&d.ok);if(d&&d.ok)_imp.needsAnchor=false;
    if(_imp.done){_players=null;_bootstrap();}else _impRedraw();
  }).catch(function(e){
    _imp.busy=false;
    var sd=e&&e.serverData;
    if(sd&&sd.needs_anchor)_imp.needsAnchor=true;
    _imp.report=(sd&&(sd.errors||sd.error))?{ok:false,errors:sd.errors||[sd.error],warnings:sd.warnings||[]}:null;
    if(!_imp.report)_imp.msg="Import failed: "+((e&&e.serverMessage)||(e&&e.message)||"unknown error");
    _impRedraw();
  });
}
function _impRun(){
  var r=_imp.report;if(!r||!r.ok||!r.dry_run||_imp.busy)return;
  var bits=[];
  if(r.players)bits.push((r.players.inserted||0)+" new and "+(r.players.updated||0)+" updated players");
  if(r.matches)bits.push((r.matches.inserted||0)+" new and "+(r.matches.updated||0)+" updated matches");
  Ui.confirm({title:"Import into "+_imp.slug+"?",message:bits.join("\n")+"\n\nNothing is deleted, and importing the same files again changes nothing.",confirmText:"Import now"}).then(function(ok){
    if(ok)_impCall(false);
  });
}

    if(c.year)cl.push('Year set to '+c.year[1]);
    if(cl.length)ok+='<div style="margin-top:8px"><strong>Competition</strong>'+_impList(cl,"var(--muted)")+'</div>';

  }
  if(r.warnings&&r.warnings.length)h+='<div style="margin:8px 0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb, var(--gold-wash) 18.4%, transparent);border:1px solid color-mix(in srgb, var(--gold-line) 48%, transparent)"><strong style="color:var(--gold-ink);font-size:12px">Worth a look:</strong>'+_impList(r.warnings,"var(--text)")+'</div>';

function _buildAdminMatchesCard(){

  h+='<h3 class="section-title" style="margin:0">Match links</h3>';

  h+='</div>';
  h+='<p style="color:var(--muted);font-size:12px;margin-bottom:12px">Paste the Cricbuzz scorecard link for each match, then tap Save. Scores are collected by the scoring run on the admin PC (score_competition.py).</p>';
  var cnt={all:0,completed:0,upcoming:0,"no-id":0};
  (_adminMatches||[]).forEach(function(m){cnt.all++;if(m.status==="completed")cnt.completed++;if(m.status==="upcoming")cnt.upcoming++;if(_adminNoLink(m))cnt["no-id"]++;});

  if(!_adminMatches){return h+'<p style="color:var(--muted);font-size:13px">Loading matches\u2026</p></div>';}
  var list=_adminMatches.filter(function(m){
    if(_adminFilter==="completed")return m.status==="completed";
    if(_adminFilter==="upcoming")return m.status==="upcoming";
    if(_adminFilter==="no-id"){var u=m.scorecard_url||"";var last=u.split("/").pop();return !last||last==="00000"||!/[1-9]/.test(last);}
    return true;
  });
  if(list.length===0){return h+'<p style="color:var(--muted);font-size:13px">No matches match the filter.</p></div>';}
  // Build Cricbuzz-ID \u2192 [match_ids] map to detect duplicates across the FULL list (not filtered)
  var _cbIdMap={};
  _adminMatches.forEach(function(mx){

  list.forEach(function(m){
    var hasId=m.scorecard_url&&/[1-9]\d{4,}/.test(m.scorecard_url||"00000");
    // Determine the Cricbuzz numeric ID from the URL for duplicate check
    var cbId=(m.scorecard_url||'').replace(/.*\//,'');
    var isDup=cbId&&cbId!=='00000'&&_cbIdMap[cbId]&&_cbIdMap[cbId].length>1;
    var dupWith=isDup?_cbIdMap[cbId].filter(function(x){return x!==m.id;}):[];
    // Build a user-friendly display title always including teams
    var teams=[];try{teams=JSON.parse(m.teams_json||'[]');}catch(e){}
    // Fallback: extract teams from title "SRH vs RCB, 1st Match" if teams_json empty
    if(teams.length<2&&m.title){var _tm=m.title.match(/^([A-Z]+)\s+vs\s+([A-Z]+)/);if(_tm)teams=[_tm[1],_tm[2]];}
    // Extract the trailing match number (e.g. "ipl26_m51" -> 51).
    // The earlier `replace(/\D/g,'')` approach glued the year prefix to the
    // number — "ipl26_m51" became "2651". Anchored regex captures only the m.. part.
    var _mn=(m.id||'').match(/_m(\d+)$/);
    var matchNo=_mn?parseInt(_mn[1],10):0;
    var teamsStr=teams.length>=2?(teams[0]+' vs '+teams[1]):'';
    var displayTitle='M'+matchNo+(teamsStr?' \u00B7 '+teamsStr:'');
    // Sub-label: date + week
    var subLabel='Week '+m.week_no+(m.date_label?' \u00B7 '+m.date_label:'');
    var inputId="url-"+m.id,statusId="st-"+m.id;
    h+='<div class="admin-match-row'+(isDup?' admin-match-dup':'')+'">';
    // Title row
    h+='<div class="admin-match-title">'+esc(displayTitle)
      +'<span class="status-pill status-'+m.status+'">'+m.status+'</span>'
      +(hasId?'<span style="color:var(--teal-ink);font-size:10px;margin-left:6px">\u2705 Has ID</span>':'<span style="color:var(--danger-ink);font-size:10px;margin-left:6px">\u26A0 No ID</span>')
      +(isDup?'<span style="color:var(--danger-ink);font-size:10px;margin-left:6px">\u26A0 Duplicate URL \u2014 also on '+esc(dupWith.join(', '))+'</span>':'')
      +'</div>';
    // Meta row: internal ID + week + date
    h+='<div class="admin-match-meta">'+esc(m.id)+' \u00B7 '+esc(subLabel)+'</div>';
    h+='<div class="admin-url-row">';
    h+='<input class="admin-url-input" id="'+inputId+'" type="url" inputmode="url" autocapitalize="off" spellcheck="false" aria-label="Scorecard link for '+esc(displayTitle)+'" placeholder="https://www.cricbuzz.com/live-cricket-scorecard/XXXXXX/..." value="'+esc(m.scorecard_url||'')+'">';
    h+='<button class="admin-save-btn" id="btn-'+m.id+'" onclick="_adminSaveUrl(\''+escAttr(m.id)+"','"+inputId+"','"+statusId+'\')" >Save link</button>';
    h+='<span class="admin-save-status" id="'+statusId+'"></span>';
    h+='</div>';
    if(m.scorecard_url&&hasId){
      var cbNum=cbId;
      h+='<div class="admin-url-current">Cricbuzz ID: <strong>'+esc(cbNum)+'</strong> \u00B7 <a href="'+esc(m.scorecard_url)+'" target="_blank" style="color:var(--teal-ink)">View scorecard</a></div>';
    } else if(m.scorecard_url){
      h+='<div class="admin-url-current" style="color:var(--danger-ink)">No valid ID in URL</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

// ─── PASSCODE PROMPT MODAL ────────────────────────────────────────────────────
// Opens when an existing member clicks their chip / pill. Asks for the 4-digit
// passcode, calls IplApi.login, and either establishes the session or shows
// an inline error and clears the boxes.
function _showPasscodePromptModal(name){
  var existing=document.getElementById('passcode-prompt-modal');
  if(existing)existing.remove();
  var h='<div id="passcode-prompt-modal" onclick="if(event.target.id===\'passcode-prompt-modal\')_closePasscodePrompt()" style="position:fixed;inset:0;z-index:999;background:color-mix(in srgb, var(--backdrop) 58%, transparent);display:flex;align-items:flex-end;justify-content:center;">';
  h+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:18px 16px 24px;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><div style="font-size:15px;font-weight:800;color:var(--gold-ink);">🔒 Welcome back, '+esc(name)+'</div><button type="button" class="modal-x" aria-label="Close" onclick="_closePasscodePrompt()">×</button></div>';
  h+='<div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Enter your 4-digit passcode to sign in.</div>';
  h+=Ui.pin({id:"passcode-input",label:"4-digit passcode",describedby:"passcode-error"});
  h+='<div id="passcode-error" style="color:var(--danger-ink);font-size:12px;min-height:16px;margin-top:6px;text-align:center;"></div>';
  h+='<button id="passcode-submit-btn" onclick="_submitPasscode(\''+escAttr(name)+'\')" class="btn btn-teal" style="margin-top:8px;width:100%;padding:12px;">Sign in</button>';
  h+='</div></div>';
  var el=document.createElement('div');el.innerHTML=h;document.body.appendChild(el.firstChild);
  setTimeout(function(){
    var inp=document.getElementById('passcode-input');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'){_submitPasscode(name);}});
      inp.addEventListener('input',function(){
        // Auto-submit when user types the 4th digit. Less friction than tapping Sign in.
        if(inp.value.replace(/\D/g,'').length===4){
          inp.value=inp.value.replace(/\D/g,'');
          _submitPasscode(name);
        }
      });
    }
  },50);
}
function _closePasscodePrompt(){var m=document.getElementById('passcode-prompt-modal');if(m)m.remove();}
function _submitPasscode(name){
  var inp=document.getElementById('passcode-input');
  var errEl=document.getElementById('passcode-error');
  var btn=document.getElementById('passcode-submit-btn');
  var pc=inp?inp.value.trim():'';
  if(!/^\d{4}$/.test(pc)){
    if(errEl)errEl.textContent='Passcode must be exactly 4 digits.';
    Ui.pinReset(inp,false);
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  if(errEl)errEl.textContent='';
  window.IplApi.login(name,pc).then(function(d){
    if(!d||!d.ok){throw new Error('login failed');}
    _closePasscodePrompt();
    _establishSession(d.name,d.is_admin,d.must_change);
  }).catch(function(e){
    var msg=(e&&e.serverMessage)?e.serverMessage:'Wrong passcode';
    if(errEl)errEl.textContent='⚠ '+msg;
    Ui.pinReset(inp,true);
    if(btn){btn.disabled=false;btn.textContent='Sign in';}
  });
}

// ─── RESET PASSCODE MODAL ─────────────────────────────────────────────────────
// Two flows share this modal:
//   forced=true  → after admin reset; title says "Temporary passcode — set a new one".

  var existing=document.getElementById('reset-passcode-modal');
  if(existing)existing.remove();
  var title=forced?'🔑 Set a New Passcode':'🔑 Reset Passcode';

  var h='<div id="reset-passcode-modal" role="dialog" aria-modal="true" aria-label="Set a passcode" '+(forced?'':'onclick="if(event.target.id===\'reset-passcode-modal\')_closeResetPasscode()"')+' style="position:fixed;inset:0;z-index:999;background:color-mix(in srgb, var(--backdrop) 58%, transparent);display:flex;align-items:flex-end;justify-content:center;">';
  h+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:18px 16px 24px;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><div style="font-size:15px;font-weight:800;color:var(--gold-ink);">'+title+'</div>';
  if(!forced)h+='<button type="button" class="modal-x" aria-label="Close" onclick="_closeResetPasscode()">×</button>';
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--muted);margin-bottom:14px;">'+sub+'</div>';
  h+='<label for="rp-new" class="pin-label">New passcode</label>';
  h+=Ui.pin({id:"rp-new",label:"New passcode",describedby:"rp-error"})+'<div style="height:12px"></div>';
  h+='<label for="rp-confirm" class="pin-label">Confirm new passcode</label>';
  h+=Ui.pin({id:"rp-confirm",label:"Confirm new passcode",describedby:"rp-error"});
  h+='<div id="rp-error" style="color:var(--danger-ink);font-size:12px;min-height:16px;margin-top:6px;text-align:center;"></div>';
  h+='<button id="rp-submit-btn" onclick="_submitResetPasscode('+(forced?'true':'false')+')" class="btn btn-teal" style="margin-top:8px;width:100%;padding:12px;">Save Passcode</button>';
  h+='</div></div>';
  var el=document.createElement('div');el.innerHTML=h;document.body.appendChild(el.firstChild);
  setTimeout(function(){var inp=document.getElementById('rp-new');if(inp){inp.focus();inp.addEventListener('input',function(){if(inp.value.length===4){var c=document.getElementById('rp-confirm');if(c)c.focus();}});}},50);
}
function _closeResetPasscode(){var m=document.getElementById('reset-passcode-modal');if(m)m.remove();}
function _submitResetPasscode(forced){
  var n=document.getElementById('rp-new'),c=document.getElementById('rp-confirm');
  var errEl=document.getElementById('rp-error'),btn=document.getElementById('rp-submit-btn');
  var nv=n?n.value.trim():'',cv=c?c.value.trim():'';
  if(!/^\d{4}$/.test(nv)){if(errEl)errEl.textContent='Passcode must be exactly 4 digits.';if(n)n.focus();return;}
  if(nv!==cv){if(errEl)errEl.textContent='Passcodes do not match.';Ui.pinReset(c,true);return;}
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  if(errEl)errEl.textContent='';
  window.IplApi.changePasscode(nv).then(function(d){
    if(!d||!d.ok)throw new Error('change failed');
    _mustChange=false;
    _closeResetPasscode();
    // Toast-style success — reuse error banner positioning, green colour.
    var t=document.createElement('div');
    t.textContent='✅ Passcode updated.';
    t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--teal-fill);color:var(--on-fill);padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;z-index:9999;box-shadow:0 4px 16px color-mix(in srgb, var(--shade) 24%, transparent);';
    document.body.appendChild(t);
    setTimeout(function(){t.remove();},2500);
    if(_state)render(_state);
  }).catch(function(e){
    var msg=(e&&e.serverMessage)?e.serverMessage:'Could not save passcode';
    if(errEl)errEl.textContent='⚠ '+msg;
    if(btn){btn.disabled=false;btn.textContent='Save Passcode';}
  });
}

// ─── SWAP MODAL ───────────────────────────────────────────────────────────────
function _showSwapModal(incomingId){
  var prevFocus=document.activeElement,inP=resolvePlayer(incomingId),inPrice=inP.price||0;
  var h='<div id="swap-modal" role="dialog" aria-modal="true" aria-labelledby="swap-title" onclick="if(event.target.id===\'swap-modal\')_closeSwapModal()" style="position:fixed;inset:0;z-index:999;background:color-mix(in srgb, var(--backdrop) 58%, transparent);display:flex;align-items:flex-end;justify-content:center;">';
  h+='<div class="swap-sheet" style="background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:18px 16px 28px;max-height:84vh;overflow-y:auto;">';
  h+='<h2 id="swap-title" class="swap-title">'+Ui.icon("swap",22)+'<span>Swap in '+esc(inP.name)+'</span>'+(inP.price?'<span class="swap-price">'+inP.price.toFixed(1)+' CR</span>':'')+'</h2>';
  h+='<p class="swap-sub">Your XI is full. Choose who leaves.</p><div role="group" aria-label="Choose who leaves your XI">';
  _nwDraft.team.forEach(function(id){
    var cur=resolvePlayer(id),avC=_avClass(cur.team),curPrice=cur.price||0;
    var diff=Math.round((inPrice-curPrice)*10)/10;
    var newRem=Math.round((_remaining()+curPrice-inPrice)*10)/10;
    var canAfford=newRem>=-0.001,need=Math.round(-newRem*10)/10;
    var roleTeam=[cur.role,cur.team].filter(Boolean).join(' \u00B7 ')+(id===_nwDraft.cap?' \u00B7 Captain':(id===_nwDraft.vc?' \u00B7 Vice-captain':''));
    var note=!canAfford?'<span class="swap-need">needs '+need.toFixed(1)+' CR more</span>':diff>0?'<span class="swap-up">\u2212'+diff.toFixed(1)+' CR</span>':diff<0?'<span class="swap-down">+'+Math.abs(diff).toFixed(1)+' CR back</span>':'<span class="swap-same">same cost</span>';
    h+='<button type="button" class="swap-row'+(canAfford?'':' is-off')+'"'+(canAfford?' onclick="_doSwap(\''+escAttr(id)+'\',\''+escAttr(incomingId)+'\')"':' aria-disabled="true" onclick="Ui.warn(\'That swap needs '+need.toFixed(1)+' CR more.\')"')+'>';
    h+='<span class="prow-avatar '+avC+'">'+esc(_initials(cur.name||id))+'</span>';
    h+='<span class="swap-info"><span class="swap-name">'+esc(cur.name||id)+'</span><span class="swap-meta">'+esc(roleTeam)+'</span></span>';
    h+='<span class="swap-cost"><b>'+(curPrice?curPrice.toFixed(1)+' CR':'')+'</b>'+note+'</span></button>';
  });
  h+='</div><button type="button" class="btn btn-ghost swap-cancel" onclick="_closeSwapModal()">Cancel</button></div></div>';
  var el=document.createElement('div');
  el.innerHTML=h;
  document.body.appendChild(el.firstChild);
  _swapKey=function(e){if(e.key==='Escape'){e.preventDefault();_closeSwapModal();}};
  document.addEventListener('keydown',_swapKey);
  _swapPrev=prevFocus;
  var first=document.querySelector('#swap-modal .swap-row:not(.is-off)')||document.querySelector('#swap-modal .swap-cancel');
  if(first)first.focus();
}
var _swapKey=null,_swapPrev=null;
function _closeSwapModal(){
  var m=document.getElementById('swap-modal');if(m)m.remove();
  if(_swapKey){document.removeEventListener('keydown',_swapKey);_swapKey=null;}
  var p=_swapPrev;_swapPrev=null;
  if(p&&document.body.contains(p)){try{p.focus({preventScroll:true});}catch(e){}}   // back to the row that opened it
}

function _doSwap(removeId,addId){
  _closeSwapModal();
  var at=_nwDraft.team.indexOf(removeId),wasCap=_nwDraft.cap===removeId,wasVc=_nwDraft.vc===removeId;
  _nwDraft.team=_nwDraft.team.filter(function(x){return x!==removeId;});
  if(wasCap)_nwDraft.cap=null;
  if(wasVc)_nwDraft.vc=null;
  _nwDraft.team.push(addId);
  _nwChanged();
  Ui.toast((resolvePlayer(addId).name||addId)+" in, "+(resolvePlayer(removeId).name||removeId)+" out",{type:"info",duration:6000,action:{label:"Undo",onClick:function(){
    if(_nwDraft.team.indexOf(addId)<0)return;
    _nwDraft.team=_nwDraft.team.filter(function(x){return x!==addId;});
    _nwDraft.team.splice(Math.min(at,_nwDraft.team.length),0,removeId);
    if(wasCap)_nwDraft.cap=removeId;
    if(wasVc)_nwDraft.vc=removeId;
    _nwChanged();

    if(_activeTab==="admin"&&_adminView==="matches"&&!_adminMatches)_loadAdminMatches();   // the Match links list was cleared by the switch: load the new competition's
    if(!_username){
      var savedTok=(window.IplAuth&&window.IplAuth.getToken)?window.IplAuth.getToken():null;
      if(savedUser&&savedTok&&state.members&&state.members[savedUser]&&window.IplApi){
        // Validate the token against the server before trusting localStorage.
        // 401 inside _fetchJson auto-clears the token; we then drop to login.
        _authPending=true;
        var _authGuard=setTimeout(function(){if(_authPending){_authPending=false;if(_state)render(_state);}},8000);   // never leave the loader stuck
        window.IplApi.whoami().then(function(d){
          clearTimeout(_authGuard);_authPending=false;
          if(d&&d.ok&&d.name===savedUser){
            _establishSession(d.name,d.is_admin,d.must_change);
          } else {
            clearUsername();render(_state||state);
          }
        },function(){   // second argument: only a failed whoami signs the user out, never an error thrown while rendering
          clearTimeout(_authGuard);_authPending=false;
          clearUsername();render(_state||state);
        });
        return;  // skip render \u2014 _establishSession or the catch will render.
      } else if(savedUser){
        clearUsername();
      }
    }
    render(state);
  }).catch(function(err){
    if(seq!==_bootSeq)return;
    console.error("[IPL] bootstrap:",err);
    if(_switching){_switchFailed=true;clearTimeout(_swGuard);if(_state)render(_state);}   // offer "Try again" instead of a card that never finishes
    showErrorBanner("Could not reach server \u2014 retrying\u2026");
    _bootRetry();
  });
  Promise.all([stP,hP]).then(function(results){
    var state=results[0],history=results[1];
    if(seq!==_bootSeq||!state||_staleState(state))return;
    if(history&&history.ok){
      _historyData=history;_currentWeek=history.current_week;_weekKnown=true;
      if(_nwDraft.team.length===0)_nwInit(_getCurrentWeekRow(history));
    }
    render(state);
  }).catch(function(){});
  plP.then(function(pl){if(seq!==_bootSeq)return;if(pl&&pl.ok!==false){setPlayers(pl);window.dispatchEvent(new CustomEvent("ipl:players-updated",{detail:pl}));}});
  lbP.then(function(lb){if(seq!==_bootSeq)return;if(lb){var norm=window.normaliseLeaderboard?window.normaliseLeaderboard(lb):lb;renderLeaderboard(norm);}});
  wkP.then(function(d){if(seq!==_bootSeq)return;if(d&&d.ok){var ch=d.week_no!==_currentWeek||!_weekKnown;_currentWeek=d.week_no;_weekKnown=true;if(ch&&_state)render(_state);}});
}

var _glueReady=false;
window.addEventListener("ipl:ready",function(){_glueReady=true;_bootstrap();});
setTimeout(function(){if(!_glueReady&&window.IplApi){_glueReady=true;_bootstrap();}},50);

window.addEventListener("ipl:state-updated",function(e){
  var state=e.detail;
  if(!state||typeof state.members!=="object"||_staleState(state))return;
  if(!_username){var saved=getSavedUsername();if(saved&&state.members[saved])_username=saved;else if(saved&&!state.members[saved])clearUsername();}
  render(state);
});
window.addEventListener("ipl:leaderboard-updated",function(e){renderLeaderboard(e.detail);});
window.addEventListener("ipl:players-updated",function(e){setPlayers(e.detail);});
window.addEventListener("ipl:error",function(e){var err=e.detail;if(err&&err.status&&err.status<500)return;showErrorBanner(err&&err.serverMessage?err.serverMessage:"Server error \u2014 retrying in 60 s\u2026");});
window.addEventListener("ipl:saved",function(){_bootstrap();});
</script>
